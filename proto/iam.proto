syntax = "proto3";

package iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vera-byte/vgo-iam/pkg/proto;iamv1";

service IAM {

  // 创建用户
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }
  
  // 获取用户
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{name}"
    };
  }
  
  // 用户列表
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }
  
  // 更新用户
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/{name}"
      body: "*"
    };
  }
  
  // 删除用户
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{name}"
    };
  }

  // 策略管理
  // 创建策略
  rpc CreatePolicy(CreatePolicyRequest) returns (Policy) {
    option (google.api.http) = {
      post: "/v1/policies"
      body: "*"
    };
  }
  
  // 获取策略列表
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse) {
    option (google.api.http) = {
      get: "/v1/policies"
    };
  }
  
  // 附加用户策略
  rpc AttachUserPolicy(AttachUserPolicyRequest)
      returns (AttachUserPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/users/{user_name}/policies/{policy_name}"
    };
  }

  // 开发者认证管理
  // 提交开发者认证
  rpc SubmitDeveloperVerification(SubmitDeveloperVerificationRequest) returns (DeveloperVerification) {
    option (google.api.http) = {
      post: "/v1/developer-verifications"
      body: "*"
    };
  }
  
  // 获取开发者认证
  rpc GetDeveloperVerification(GetDeveloperVerificationRequest) returns (DeveloperVerification) {
    option (google.api.http) = {
      get: "/v1/developer-verifications/{user_name}/{developer_type}"
    };
  }
  
  // 开发者认证列表
  rpc ListDeveloperVerifications(ListDeveloperVerificationsRequest) returns (ListDeveloperVerificationsResponse) {
    option (google.api.http) = {
      get: "/v1/developer-verifications"
    };
  }
  
  // 审核开发者认证
  rpc ReviewDeveloperVerification(ReviewDeveloperVerificationRequest) returns (DeveloperVerification) {
    option (google.api.http) = {
      put: "/v1/developer-verifications/{verification_id}/review"
      body: "*"
    };
  }

  // 应用管理
  // 创建应用
  rpc CreateApplication(CreateApplicationRequest) returns (Application) {
    option (google.api.http) = {
      post: "/v1/applications"
      body: "*"
    };
  }
  
  // 获取应用
  rpc GetApplication(GetApplicationRequest) returns (Application) {
    option (google.api.http) = {
      get: "/v1/applications/{app_id}"
    };
  }
  
  // 应用列表
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {
    option (google.api.http) = {
      get: "/v1/applications"
    };
  }
  
  // 更新应用
  rpc UpdateApplication(UpdateApplicationRequest) returns (Application) {
    option (google.api.http) = {
      put: "/v1/applications/{app_id}"
      body: "*"
    };
  }
  
  // 删除应用
  rpc DeleteApplication(DeleteApplicationRequest) returns (DeleteApplicationResponse) {
    option (google.api.http) = {
      delete: "/v1/applications/{app_id}"
    };
  }

  // 访问密钥管理
  // 创建访问密钥
  rpc CreateAccessKey(CreateAccessKeyRequest) returns (AccessKey) {
    option (google.api.http) = {
      post: "/v1/access-keys"
      body: "*"
    };
  }
  
  // 访问密钥列表
  rpc ListAccessKeys(ListAccessKeysRequest) returns (ListAccessKeysResponse) {
    option (google.api.http) = {
      get: "/v1/access-keys"
    };
  }
  
  // 更新访问密钥状态
  rpc UpdateAccessKeyStatus(UpdateAccessKeyStatusRequest) returns (AccessKey) {
    option (google.api.http) = {
      put: "/v1/access-keys/{access_key_id}/status"
      body: "*"
    };
  }

  // 权限验证
  // 验证访问密钥
  rpc VerifyAccessKey(VerifyRequest) returns (VerifyResponse) {
    option (google.api.http) = {
      post: "/v1/verify-access-key"
      body: "*"
    };
  }
  
  // 检查权限
  rpc CheckPermission(CheckPermissionRequest)
      returns (CheckPermissionResponse) {
    option (google.api.http) = {
      post: "/v1/check-permission"
      body: "*"
    };
  }
  
  // 验证权限
  rpc ValidatePermission(ValidatePermissionRequest) returns (ValidatePermissionResponse) {
    option (google.api.http) = {
      post: "/v1/validate-permission"
      body: "*"
    };
  }

  // STS临时授权服务
  // 假设角色
  rpc AssumeRole(AssumeRoleRequest) returns (AssumeRoleResponse) {
    option (google.api.http) = {
      post: "/v1/sts/assume-role"
      body: "*"
    };
  }
  
  // 获取会话令牌
  rpc GetSessionToken(GetSessionTokenRequest) returns (GetSessionTokenResponse) {
    option (google.api.http) = {
      post: "/v1/sts/session-token"
      body: "*"
    };
  }
  
  // 刷新令牌
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/sts/refresh-token"
      body: "*"
    };
  }
  
  // 撤销令牌
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {
    option (google.api.http) = {
      post: "/v1/sts/revoke-token"
      body: "*"
    };
  }

  // Dashboard相关接口
  // 获取统计数据
  rpc GetDashboardStats(DashboardStatsRequest) returns (DashboardStatsResponse) {
    option (google.api.http) = {
      get: "/v1/dashboard/stats"
    };
  }
  
  // 获取系统状态
  rpc GetDashboardStatus(DashboardStatusRequest) returns (DashboardStatusResponse) {
    option (google.api.http) = {
      get: "/v1/dashboard/status"
    };
  }
  
  // 获取最近活动
  rpc GetDashboardActivities(DashboardActivitiesRequest) returns (DashboardActivitiesResponse) {
    option (google.api.http) = {
      get: "/v1/dashboard/activities"
    };
  }
}

// 用户相关消息
message CreateUserRequest {
  string name = 1;
  string display_name = 2;
  string email = 3;
}

message GetUserRequest { string name = 1; }

message ListUsersRequest {
  int32 page = 1;
  int32 size = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
  int32 page = 3;
  int32 size = 4;
}

message UpdateUserRequest {
  string name = 1;
  string display_name = 2;
  string email = 3;
}

message DeleteUserRequest {
  string name = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message User {
  int64 id = 1;
  string name = 2;
  string display_name = 3;
  string email = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// 策略相关消息
message CreatePolicyRequest {
  string name = 1;
  string description = 2;
  string policy_document = 3; // JSON字符串
}

message AttachUserPolicyRequest {
  string user_name = 1;
  string policy_name = 2;
}

message AttachUserPolicyResponse { bool success = 1; }

// 策略列表请求
message ListPoliciesRequest {
  int32 page = 1;      // 页码（从1开始）
  int32 page_size = 2; // 每页大小（最大100）
}

// 策略列表响应
message ListPoliciesResponse {
  repeated Policy policies = 1; // 策略列表
  int32 total = 2;             // 总数
  int32 page = 3;              // 当前页码
  int32 page_size = 4;         // 每页大小
}

message Policy {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string policy_document = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// 开发者认证相关消息
message SubmitDeveloperVerificationRequest {
  string developer_type = 1; // individual/enterprise
  
  // 个人开发者信息
  string real_name = 2;
  string id_card_number = 3;
  string id_card_front_url = 4;
  string id_card_back_url = 5;
  
  // 企业开发者信息
  string company_name = 6;
  string business_license_number = 7;
  string business_license_url = 8;
  string legal_representative = 9;
  string company_address = 10;
}

message GetDeveloperVerificationRequest {
  string user_name = 1;
  string developer_type = 2;
}

message ListDeveloperVerificationsRequest {
  string status = 1; // pending/approved/rejected
  int32 page = 2;
  int32 page_size = 3;
}

message ReviewDeveloperVerificationRequest {
  int64 verification_id = 1;
  string status = 2; // approved/rejected
  string review_comment = 3;
}

message DeveloperVerification {
  int64 id = 1;
  string user_name = 2;
  string developer_type = 3;
  string status = 4;
  
  // 个人开发者信息
  string real_name = 5;
  string id_card_number = 6;
  string id_card_front_url = 7;
  string id_card_back_url = 8;
  
  // 企业开发者信息
  string company_name = 9;
  string business_license_number = 10;
  string business_license_url = 11;
  string legal_representative = 12;
  string company_address = 13;
  
  // 审核信息
  string reviewer_name = 14;
  string review_comment = 15;
  google.protobuf.Timestamp reviewed_at = 16;
  
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message ListDeveloperVerificationsResponse {
  repeated DeveloperVerification verifications = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 应用管理相关消息
message CreateApplicationRequest {
  string app_name = 1;
  string app_description = 2;
  string app_type = 3; // web/mobile/desktop/api
  string app_icon_url = 4;
  string app_website = 5;
  repeated string callback_urls = 6;
  repeated string allowed_origins = 7;
}

message GetApplicationRequest {
  int64 app_id = 1;
}

message ListApplicationsRequest {
  string user_name = 1;
  string status = 2; // active/inactive/suspended
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateApplicationRequest {
  int64 app_id = 1;
  string app_name = 2;
  string app_description = 3;
  string app_type = 4;
  string app_icon_url = 5;
  string app_website = 6;
  repeated string callback_urls = 7;
  repeated string allowed_origins = 8;
  string status = 9;
}

message DeleteApplicationRequest {
  int64 app_id = 1;
}

message DeleteApplicationResponse {
  bool success = 1;
}

message Application {
  int64 id = 1;
  string user_name = 2;
  string app_name = 3;
  string app_description = 4;
  string app_type = 5;
  string app_icon_url = 6;
  string app_website = 7;
  repeated string callback_urls = 8;
  repeated string allowed_origins = 9;
  string status = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ListApplicationsResponse {
  repeated Application applications = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 访问密钥相关消息
message CreateAccessKeyRequest {
  string user_name = 1;
  int64 app_id = 2; // 关联的应用ID
  string description = 3;
}

message ListAccessKeysRequest {
  string user_name = 1;
  int64 app_id = 2; // 可选，筛选特定应用的密钥
}

message UpdateAccessKeyStatusRequest {
  string access_key_id = 1;
  string status = 2; // active/inactive
}

message AccessKey {
  string access_key_id = 1;
  string secret_access_key = 2; // 仅在创建时返回
  string status = 3;
  string user_name = 4;
  int64 app_id = 5;
  string app_name = 6;
  string description = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListAccessKeysResponse { repeated AccessKey access_keys = 1; }

// 验证相关消息
message VerifyRequest {
  // string access_key_id = 1;
  // string signature = 2;
  // string request_data = 3; // 序列化的请求数据
  // string timestamp = 4;    // ISO8601格式
}

message VerifyResponse {
  bool valid = 1;
  string user_name = 2;
}

message CheckPermissionRequest {
  string user_name = 1;
  string action = 2;
  string resource = 3;
}

message CheckPermissionResponse { bool allowed = 1; }

message ValidatePermissionRequest {
  string user_name = 1;
  string action = 2;
  string resource = 3;
}

message ValidatePermissionResponse {
  bool allowed = 1;
}

// STS临时授权相关消息
message AssumeRoleRequest {
  string role_arn = 1;                    // 角色ARN
  string role_session_name = 2;           // 会话名称
  int32 duration_seconds = 3;             // 有效期（秒），默认3600，最大43200
  string external_id = 4;                 // 外部ID（可选）
  string policy = 5;                      // 会话策略（可选，JSON格式）
  map<string, string> tags = 6;           // 会话标签（可选）
}

message AssumeRoleResponse {
  TemporaryCredentials credentials = 1;    // 临时凭证
  AssumedRoleUser assumed_role_user = 2;   // 假设角色用户信息
  int32 packed_policy_size = 3;           // 打包策略大小
}

message GetSessionTokenRequest {
  int32 duration_seconds = 1;             // 有效期（秒），默认3600，最大129600
  string serial_number = 2;               // MFA设备序列号（可选）
  string token_code = 3;                  // MFA令牌代码（可选）
}

message GetSessionTokenResponse {
  TemporaryCredentials credentials = 1;    // 临时凭证
}

message RefreshTokenRequest {
  string session_token = 1;               // 当前会话令牌
  int32 duration_seconds = 2;             // 新的有效期（秒）
}

message RefreshTokenResponse {
  TemporaryCredentials credentials = 1;    // 新的临时凭证
}

message RevokeTokenRequest {
  string session_token = 1;               // 要撤销的会话令牌
}

message RevokeTokenResponse {
  bool success = 1;                       // 撤销是否成功
  string message = 2;                     // 响应消息
}

message TemporaryCredentials {
  string access_key_id = 1;               // 临时访问密钥ID
  string secret_access_key = 2;           // 临时密钥
  string session_token = 3;               // 会话令牌
  google.protobuf.Timestamp expiration = 4; // 过期时间
}

message AssumedRoleUser {
  string arn = 1;                         // 假设角色用户ARN
  string assumed_role_id = 2;             // 假设角色ID
}

// Dashboard相关消息
message DashboardStatsRequest {}

message DashboardStatsResponse {
  int32 users = 1;                        // 用户总数
  int32 access_keys = 2 [json_name = "accessKeys"];  // 访问密钥总数
  int32 policies = 3;                     // 策略总数
  int32 applications = 4;                 // 应用总数
}

message DashboardStatusRequest {}

message DashboardStatusResponse {
  string service_status = 1;              // 服务状态: healthy/unhealthy
  string database_status = 2;             // 数据库状态: connected/disconnected
  string uptime = 3;                      // 运行时间
  string version = 4;                     // 版本信息
}

message DashboardActivitiesRequest {
  int32 limit = 1;                        // 限制返回数量，默认10
}

message Activity {
  string id = 1;                          // 活动ID
  string type = 2;                        // 活动类型
  string description = 3;                 // 活动描述
  string user = 4;                        // 操作用户
  google.protobuf.Timestamp timestamp = 5; // 时间戳
}

message DashboardActivitiesResponse {
  repeated Activity activities = 1;        // 活动列表
}